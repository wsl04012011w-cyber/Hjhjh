<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Papo - Mensagens Instantâneas</title>
    <meta name="description" content="Aplicativo de mensagens instantâneas simples e moderno para amigos, com chats diretos e em grupo, IDs únicos e sincronização em tempo real." />
    
    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Papo" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <meta property="og:title" content="Papo - Mensagens Instantâneas" />
    <meta property="og:description" content="Aplicativo de mensagens instantâneas simples e moderno para amigos, com chats diretos e em grupo, IDs únicos e sincronização em tempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
